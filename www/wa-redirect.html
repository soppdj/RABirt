<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Menghubungkan ke WhatsApp Admin - Rabirt v.1.0</title>
  <meta name="theme-color" content="#3C7268" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #F1F5F9;
      color: #1E293B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .redirect-card {
      background: #FFFFFF;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(60, 114, 104, 0.12);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #E2E8F0;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      background: #E8F5E9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.2);
    }
    .icon-wrap svg {
      width: 44px;
      height: 44px;
      fill: #25D366;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      color: #1E293B;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13.5px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #25D366;
      border-radius: 99px;
      animation: fillProgress 1.2s ease forwards;
    }
    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .btn-wa {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35);
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-wa:active {
      transform: scale(0.98);
    }
    .btn-alt {
      display: block;
      background: #F8FAFC;
      color: #3C7268;
      border: 1.5px solid #CBD5E1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .btn-alt:active {
      background: #E2E8F0;
    }
    .phone-info {
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-copy {
      background: #3C7268;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .footer-text {
      margin-top: 18px;
      font-size: 11.5px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.41a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.42 0-2.82-.37-4.06-1.08l-.29-.17-3.12.82.83-3.04-.19-.3a8.21 8.21 0 0 1-1.26-4.46c0-4.54 3.69-8.24 8.24-8.24zm4.52 11.64c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.4-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.29.38-.44.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.48c-.16 0-.42.06-.64.3-.22.25-.85.83-.85 2.02s.87 2.34.99 2.5c.13.17 1.72 2.62 4.16 3.67.58.25 1.03.4 1.39.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.18-.47-.3z"/>
      </svg>
    </div>

    <h1 class="title">Menghubungkan ke WhatsApp</h1>
    <p class="subtitle">Sedang mengalihkan Anda ke WhatsApp Admin resmi untuk perpanjangan atau pembelian token Rabirt...</p>

    <div class="progress-bar-wrap">
      <div class="progress-bar"></div>
    </div>

    <!-- Tombol Utama: wa.link -->
    <a id="btnMainWa" href="https://wa.link/bfp48a" class="btn-wa">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"/>
      </svg>
      <span>Buka WhatsApp Sekarang</span>
    </a>

    <!-- Tombol Alternatif Direct API -->
    <a id="btnDirectWa" href="https://api.whatsapp.com/send?phone=6285150782500&text=Assalamu%27alaikum%20Bunda.%20Saya%20mau%20token%20perpanjangan%20aplikasi%20Rabirt.%20Mohon%20dibantu%20ya%2C%20Bun." class="btn-alt">
      Buka via WhatsApp Web / Alternatif
    </a>

    <div class="phone-info">
      <span>No. Admin: <strong>0851-5078-2500</strong></span>
      <button type="button" class="btn-copy" onclick="copyNumber()">Salin No</button>
    </div>

    <p class="footer-text">Rabirt v.1.0 • Ibu Rumah Tangguh</p>
  </div>

  <script>
    function copyNumber() {
      navigator.clipboard.writeText('085150782500').then(() => {
        alert('Nomor WhatsApp Admin (0851-5078-2500) berhasil disalin!');
      }).catch(() => {
        prompt('Silakan salin nomor WhatsApp Admin:', '085150782500');
      });
    }

    // Auto-redirect ke wa.link setelah 800ms
    setTimeout(() => {
      window.location.href = "https://wa.link/bfp48a";
    }, 800);
  </script>
</body>
</html>
